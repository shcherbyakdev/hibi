name: Desktop release

# Push a tag desktop-v<x.y.z> to build hibi.app and publish a GitHub Release
# with the dmg, the signed .app.zip and latest.json (the updater's feed:
# releases/latest/download/latest.json).
#
# Two jobs on purpose: `build` runs npm and the web build (third-party code)
# and never sees the signing key; `release` runs on a fresh runner with no
# npm at all, signs with our stdlib-only hibi-sign, and publishes.
on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      # The tag reaches the shell as an env var, never spliced into the
      # script; release-desktop.sh refuses anything but x.y.z.
      - run: scripts/release-desktop.sh build "${GITHUB_REF_NAME#desktop-v}"
        env:
          # The hosted project the app signs in to (both values are public:
          # the site ships them too). Unset = a build with no sign-in.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.HIBI_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.HIBI_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: desktop/go.mod
          cache: false # nothing restored from a cache the build job could have written
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: scripts/release-desktop.sh sign "${GITHUB_REF_NAME#desktop-v}"
        env:
          HIBI_UPDATE_PRIVATE_KEY: ${{ secrets.HIBI_UPDATE_PRIVATE_KEY }}
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "hibi for Mac ${GITHUB_REF_NAME#desktop-v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
